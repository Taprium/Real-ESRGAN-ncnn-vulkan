  create_release_upload:
    # needs: [build-x64, build-arm64, build-armv7, build-armv6]
    needs: [build-x64, build-arm64]
    runs-on: ubuntu-latest
    # CRITICAL: This condition ensures the job only runs if the push was a tag
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout To Create Release
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: List Downloaded Files
        run: |
          ls -lahR ./artifacts

      - name: Create Release
        # id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag_name: ${{ github.ref }}
          # name: Release ${{ github.ref }}
          draft: true
          files: |
            ./artifacts/realesrgan-ncnn-vulkan-alpine-arm64/realesrgan-ncnn-vulkan-alpine-arm64
            ./artifacts/realesrgan-ncnn-vulkan-alpine-x64/realesrgan-ncnn-vulkan-alpine-x64
            

