name: CI
on: ["push"]
permissions:
  packages: write
  contents: write

jobs:
  build-x64:
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - name: Install git
        run: |
          apk update
          apk add git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Dependencies
        run: |
          apk update
          apk add build-base cmake protobuf-dev vulkan-loader-dev glslang
          mkdir build && cd build
          cmake ../src
          cmake --build . -j$(nproc) 
          mv realesrgan-ncnn-vulkan realesrgan-ncnn-vulkan-alpine-x64
     
      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          retention-days: 1
          name: realesrgan-ncnn-vulkan-alpine-x64
          path: build/realesrgan-ncnn-vulkan-alpine-x64

  build-arm64:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Compile code in alpine:3.22 ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
          -v .:/source \
          alpine:3.22 /bin/sh -c "
            cd /source
            apk update
            apk add build-base cmake protobuf-dev vulkan-loader-dev glslang
            mkdir build && cd build
            cmake ../src
            cmake --build . -j$(nproc)
            mv realesrgan-ncnn-vulkan realesrgan-ncnn-vulkan-alpine-arm64
          "
      
      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          retention-days: 1
          name: realesrgan-ncnn-vulkan-alpine-arm64
          path: build/realesrgan-ncnn-vulkan-alpine-arm64

